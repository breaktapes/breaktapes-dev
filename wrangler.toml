name = "breaktapes-app"
main = "worker/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "b09f233e618dc7f23bcb247c947eb303"

assets = { directory = "dist", html_handling = "auto-trailing-slash", binding = "ASSETS" }

# Production: app.breaktapes.com (athlete app) + admin.breaktapes.com (admin dashboard)
# Both served by the same Worker + bundle; the app detects the host at runtime
# (IS_ADMIN_HOST in src/App.tsx) and renders the locked admin shell on the
# admin subdomain.
#
# admin.breaktapes.com uses `custom_domain = true`, which auto-provisions the
# Cloudflare DNS record + TLS cert on `wrangler deploy` — no manual DNS step.
# (app.breaktapes.com stays a zone route because its DNS record already exists.)
# Deploy: wrangler deploy
routes = [
  { pattern = "app.breaktapes.com/*",   zone_id = "7d1d8be858893e977e57b0455ed2388f" },
  { pattern = "admin.breaktapes.com",   custom_domain = true }
]

[vars]
SUPABASE_URL = "https://kmdpufauamadwavqsinj.supabase.co"
POSTHOG_HOST = "https://us.i.posthog.com"

# Secrets (set via `wrangler secret put`):
#   SUPABASE_ANON_KEY
#   ADMIN_USER_IDS      — comma-separated Clerk user IDs with admin access
#                         e.g. "user_2abc...,user_2xyz..."
#   POSTHOG_API_KEY     — PostHog public project token

# KV for profile view counts (optional — Worker works without it):
#   1. wrangler kv:namespace create "profile-cache"
#   2. Add the returned IDs below and uncomment:
# [[kv_namespaces]]
# binding = "PROFILE_KV"
# id = "<KV_NAMESPACE_ID>"
# preview_id = "<KV_PREVIEW_ID>"

# Staging: dev.breaktapes.com
# Deploy: wrangler deploy --env staging
[env.staging]
name = "breaktapes-app-staging"
main = "worker/index.js"
assets = { directory = "dist", html_handling = "auto-trailing-slash", binding = "ASSETS" }
routes = [
  { pattern = "dev.breaktapes.com/*", zone_id = "7d1d8be858893e977e57b0455ed2388f" }
]

[env.staging.vars]
SUPABASE_URL = "https://yqzycwuyhvzkbofwkazr.supabase.co"
POSTHOG_HOST = "https://us.i.posthog.com"

# Secrets for staging (set via `wrangler secret put --env staging`):
#   SUPABASE_ANON_KEY
#   ADMIN_USER_IDS

# [[env.staging.kv_namespaces]]
# binding = "PROFILE_KV"
# id = "<KV_STAGING_NAMESPACE_ID>"
# preview_id = "<KV_STAGING_PREVIEW_ID>"
