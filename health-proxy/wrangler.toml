name = "breaktapes-health"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "b09f233e618dc7f23bcb247c947eb303"

# Production route: health.breaktapes.com
# custom_domain = true auto-provisions the DNS record — no manual step required
routes = [
  { pattern = "health.breaktapes.com", custom_domain = true }
]

# Retention emails — daily at 13:00 UTC. The scheduled() handler sends due
# race-day reminders every day and the weekly digest on Mondays. No-ops until
# the SUPABASE_SERVICE_ROLE_KEY + RESEND_API_KEY secrets are set.
[triggers]
crons = ["0 13 * * *"]

[vars]
POSTHOG_HOST = "https://us.i.posthog.com"

# Secrets (set via wrangler secret put — never commit values here):
#   wrangler secret put OW_BASE_URL              → paste Railway OW URL
#   wrangler secret put OW_API_KEY               → paste OW admin API key
#   wrangler secret put POSTHOG_API_KEY          → PostHog public project token
#   wrangler secret put RESEND_API_KEY           → Resend API key (re_…) for /email/send + retention cron
#   wrangler secret put SUPABASE_URL             → https://<project>.supabase.co (retention cron reads user_state)
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY → service role key (retention cron — bypasses RLS)
