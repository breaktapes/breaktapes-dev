# breaktapes.com (apex marketing domain).
#
# Serves the app's built static assets directly (Workers Static Assets), so the
# browser loads the SPA at breaktapes.com and the React app (App.tsx) detects the
# apex host and renders the cinematic marketing landing. app.breaktapes.com stays
# the login/app.
#
# NOTE: this is a SNAPSHOT of the app build. Re-deploy this worker whenever the
# marketing landing changes:  cd landing-worker && npx wrangler deploy
# (the build step below rebuilds ../dist first).
name = "breaktapes-landing"
compatibility_date = "2024-09-23"
account_id = "b09f233e618dc7f23bcb247c947eb303"

routes = [
  { pattern = "breaktapes.com/*", zone_id = "7d1d8be858893e977e57b0455ed2388f" }
]

# Rebuild the app before deploying so the uploaded assets are current.
[build]
command = "npm --prefix .. run build"

# Serve the Vite build output. SPA fallback returns index.html for any path
# (client-side routing: /, /demo, /privacy, etc.).
[assets]
directory = "../dist"
not_found_handling = "single-page-application"
